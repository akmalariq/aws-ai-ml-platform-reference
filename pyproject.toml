[project]
name = "aws-ai-ml-platform-reference"
version = "0.1.0"
description = "A runnable reference implementation of an AWS AI/ML platform: S3 lake house with Glue and Athena, a SageMaker-style training pipeline with a model registry, FastAPI serving, a Streamlit app, and a Bedrock RAG path with a local fallback."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "joblib>=1.4",
]

[project.optional-dependencies]
app = ["streamlit>=1.39"]
mlops = ["mlflow>=2.17"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
awsml = "awsml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awsml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28",
]
